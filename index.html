<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smart Blind Assistant v3.0</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#080c14;--bg2:#0d1421;--bg3:#111a2e;--card:#131e33;--card2:#182540;
  --border:rgba(255,255,255,0.07);--border2:rgba(99,179,237,0.25);
  --blue:#63b3ed;--teal:#4fd1c7;--green:#68d391;--orange:#f6ad55;
  --red:#fc8181;--purple:#b794f4;--yellow:#f6e05e;
  --t1:#e2e8f0;--t2:#8892a4;--t3:#4a5568;
  --gblue:rgba(99,179,237,0.12);--gteal:rgba(79,209,199,0.12);
  --r:14px;--rs:8px;
}
html,body{height:100%;font-family:'Syne',sans-serif;background:var(--bg);color:var(--t1);overflow-x:hidden;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg2);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}

@keyframes pulse-ring{0%{transform:scale(1);opacity:1;}100%{transform:scale(1.8);opacity:0;}}
@keyframes scan{0%{top:0%;}100%{top:100%;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px);}to{opacity:1;transform:translateX(0);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
@keyframes wave{0%,100%{height:5px;}50%{height:20px;}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,179,237,0.2);}50%{box-shadow:0 0 40px rgba(99,179,237,0.5);}}
@keyframes mlPulse{0%,100%{opacity:0.6;}50%{opacity:1;}}
@keyframes navStep{from{opacity:0;transform:translateX(-20px);}to{opacity:1;transform:translateX(0);}}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;min-height:100vh;}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
main{flex:1;padding:18px;max-width:1100px;margin:0 auto;width:100%;}
nav{background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:8px 0 14px;position:sticky;bottom:0;}

/* ── TABS ── */
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border:none;background:transparent;cursor:pointer;font-family:'Syne',sans-serif;transition:all 0.2s;}
.tab-icon{width:38px;height:38px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.tab-icon.active{background:rgba(99,179,237,0.15);}
.tab-label{font-size:11px;font-weight:600;color:var(--t3);transition:color 0.2s;}
.tab-label.active{color:var(--blue);}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;}
.card-hd{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}

/* ── BUTTONS ── */
.btn{padding:10px 6px;border-radius:var(--rs);border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all 0.2s;color:var(--t2);}
.btn:hover{border-color:var(--border2);}
.btn.active{border-color:currentColor;background:rgba(255,255,255,0.05);}
.btn-primary{width:100%;padding:13px;border-radius:var(--rs);border:none;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity 0.2s;}
.btn-primary:disabled{background:var(--bg3);color:var(--t3);cursor:wait;}
.btn-outline{padding:8px 16px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--gblue);color:var(--blue);cursor:pointer;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}

/* ── TOGGLE ── */
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.toggle{width:44px;height:24px;border-radius:99px;border:none;cursor:pointer;position:relative;transition:background 0.3s;}
.toggle-knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left 0.3s;box-shadow:0 1px 4px rgba(0,0,0,0.4);}

/* ── INPUT ── */
.input-wrap{margin-bottom:14px;}
.input-label{display:block;font-size:13px;color:var(--t2);margin-bottom:6px;font-weight:500;}
.input-field{width:100%;padding:12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg2);color:var(--t1);font-size:14px;font-family:'Syne',sans-serif;outline:none;transition:border-color 0.2s;}
.input-field:focus{border-color:var(--blue);}
.input-field::placeholder{color:var(--t3);}

/* ── ML ENGINE BADGE ── */
.ml-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;animation:mlPulse 2s infinite;}
.ml-yolo{background:rgba(183,148,244,0.15);color:var(--purple);border:1px solid rgba(183,148,244,0.3);}
.ml-claude{background:rgba(99,179,237,0.15);color:var(--blue);border:1px solid rgba(99,179,237,0.3);}
.ml-hybrid{background:rgba(104,211,145,0.15);color:var(--green);border:1px solid rgba(104,211,145,0.3);}

/* ── NOTIF ── */
#notif{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 22px;border-radius:var(--rs);font-size:14px;font-weight:600;animation:fadeIn 0.3s ease;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:none;white-space:nowrap;}

/* ── PROFILE SCREEN ── */
#profile-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
.profile-card{width:100%;max-width:520px;animation:fadeIn 0.5s ease;}
.avatar-btn{font-size:26px;width:50px;height:50px;border-radius:50%;border:2px solid var(--border);background:transparent;cursor:pointer;transition:all 0.2s;}
.avatar-btn.selected{border-color:var(--blue);background:var(--gblue);}
.progress-bar{height:4px;border-radius:99px;transition:all 0.4s ease;}

/* ── CAMERA ── */
.cam-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;}
.video-wrap{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:16/9;transition:all 0.4s;}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--teal),transparent);animation:scan 2s linear infinite;opacity:0.7;}
.bbox{position:absolute;border-radius:5px;padding:3px 8px;font-size:11px;font-family:'IBM Plex Mono',monospace;background:rgba(0,0,0,0.75);animation:fadeIn 0.3s;}
.cam-label{position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.65);border-radius:5px;padding:4px 10px;font-size:12px;color:var(--t2);font-family:'IBM Plex Mono',monospace;}
.ctrl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;}
.cmd-chip{padding:3px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--border);font-size:11px;color:var(--t2);font-family:'IBM Plex Mono',monospace;cursor:pointer;transition:all 0.2s;}
.cmd-chip:hover{border-color:var(--blue);color:var(--blue);}

/* ── MAP ── */
.map-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;}
.map-frame{height:360px;position:relative;background:#0a101e;}
.nav-step{display:flex;gap:10px;margin-bottom:10px;animation:navStep 0.4s ease both;}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ── HISTORY ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.stat-card{background:var(--card);border-radius:var(--rs);padding:14px 10px;border:1px solid var(--border);text-align:center;}
.hist-item{background:var(--card);border-radius:var(--rs);border:1px solid var(--border);padding:14px;animation:fadeIn 0.3s ease;}

/* ── SETTINGS ── */
.setting-section{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:20px;margin-bottom:14px;}
.setting-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--border);}

/* ── VOICE WAVE ── */
.wave-bar{width:3px;border-radius:99px;background:var(--teal);animation:wave 0.8s ease-in-out infinite;}

/* ── COMMAND CENTER ── */
.cmd-center{margin-top:12px;background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:16px;}
.cmd-section-title{font-size:11px;color:var(--t3);font-weight:700;letter-spacing:1px;margin-bottom:10px;}
.cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
.cmd-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;cursor:pointer;transition:all 0.2s;}
.cmd-card:hover{border-color:var(--blue);background:var(--gblue);}
.cmd-card-title{font-size:12px;font-weight:700;color:var(--t1);margin-bottom:2px;}
.cmd-card-ex{font-size:11px;color:var(--t3);font-family:'IBM Plex Mono',monospace;}

/* ── ML ENGINE PANEL ── */
.ml-panel{background:linear-gradient(135deg,rgba(15,25,45,0.9),rgba(10,18,35,0.9));border:1px solid rgba(99,179,237,0.2);border-radius:var(--r);padding:16px;margin-top:12px;}
.ml-bar-wrap{margin-bottom:8px;}
.ml-bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
.ml-bar{height:6px;border-radius:99px;background:var(--bg3);}
.ml-bar-fill{height:100%;border-radius:99px;transition:width 0.6s ease;}

/* ── DETECTION CARD ── */
.det-item{padding:12px 16px;border-bottom:1px solid var(--border);animation:slideIn 0.3s ease;}
.risk-badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;}
.conf-bar{height:4px;flex:1;border-radius:99px;background:var(--bg2);margin-right:8px;}
.conf-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--teal));}

@media(max-width:768px){
  .cam-grid,.map-grid{grid-template-columns:1fr;}
  .ctrl-grid{grid-template-columns:repeat(3,1fr);}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div id="app"></div>

<div id="notif"></div>

<script>
// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
const S = {
  profile: null,
  tab: 'camera',
  detections: [],
  history: [],
  isScanning: false,
  isListening: false,
  voiceStatus: '',
  cameraActive: false,
  cameraFacing: 'environment',
  cameraError: '',
  sceneText: '',
  sceneLoading: false,
  navSteps: [],
  navLoading: false,
  navDest: '',
  activeNavStep: 0,
  navGuiding: false,
  userLocation: null,
  manualLocation: '',
  settings: {
    voiceSpeed: 1, voicePitch: 1, autoSpeak: true,
    highRiskAlert: true, scanInterval: 3,
    saveHistory: true, hybridML: true, confidenceThreshold: 0.6
  },
  logs: [],
  profileStep: 1,
  profileData: {name:'',age:'',language:'English',voiceSpeed:'Normal',caregiverName:'',caregiverPhone:'',avatar:'👤'},
  mlStats: {yolo: 0, claude: 0, hybrid: 0},
  appActions: [],
  setupDone: false,
};

// ═══════════════════════════════════════
// ML HYBRID ENGINE
// ═══════════════════════════════════════
const OBSTACLES = ["Chair","Table","Door","Wall","Car","Person","Bicycle","Stairs","Window","Desk","Bed","Cabinet","Sofa","Shelf","Pillar","Dog","Cat","Motorcycle","Bus","Trash Can","Tree","Pole","Fence","Sign","Step"];
const DIRECTIONS = ["ahead","to your left","to your right","slightly left","slightly right","1 meter ahead","2 meters ahead","3 meters ahead","diagonally left","diagonally right"];
const ACTIONS_MAP = {
  high: ["Stop immediately — danger ahead","Move sharply left","Move sharply right","Back away slowly","Call for help"],
  medium: ["Move left to avoid","Move right to avoid","Proceed with caution","Slow down and navigate around"],
  low: ["Path is mostly clear","Proceed carefully","Minor obstacle — step around it"]
};

// YOLO-style mock detection (confidence + bounding box data)
function yoloDetect() {
  const count = Math.floor(Math.random() * 3) + 1;
  return Array.from({length: count}, () => {
    const obj = OBSTACLES[Math.floor(Math.random() * OBSTACLES.length)];
    const yoloConf = 0.55 + Math.random() * 0.42;
    return {
      id: Math.random().toString(36).slice(2),
      object: obj,
      direction: DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)],
      yoloConf: parseFloat(yoloConf.toFixed(3)),
      distance: `${(0.5 + Math.random() * 4).toFixed(1)}m`,
      bbox: {x: Math.random() * 60, y: Math.random() * 40, w: 20 + Math.random() * 25, h: 18 + Math.random() * 22},
    };
  });
}

// Claude-style semantic scoring (simulated contextual understanding)
function claudeScore(yoloItems) {
  return yoloItems.map(item => {
    const contextBoost = ['Stairs','Car','Motorcycle','Bus'].includes(item.object) ? 0.08 : 0;
    const distFactor = parseFloat(item.distance) < 1.5 ? 0.06 : 0;
    const claudeConf = Math.min(0.99, item.yoloConf + contextBoost + distFactor + (Math.random() * 0.04 - 0.02));
    return {...item, claudeConf: parseFloat(claudeConf.toFixed(3))};
  });
}

// Hybrid fusion: weighted average + context awareness
function hybridFuse(claudeItems) {
  return claudeItems.map(item => {
    const hybridConf = parseFloat((item.yoloConf * 0.45 + item.claudeConf * 0.55).toFixed(3));
    const risk = hybridConf > 0.82 ? 'high' : hybridConf > 0.65 ? 'medium' : 'low';
    const actions = ACTIONS_MAP[risk];
    return {
      ...item,
      hybridConf,
      risk,
      action: actions[Math.floor(Math.random() * actions.length)],
      confidence: hybridConf,
      timestamp: new Date().toLocaleTimeString(),
    };
  });
}

function generateDetection() {
  const yoloOut = yoloDetect();
  if (!S.settings.hybridML) {
    return yoloOut.map(d => ({
      ...d, confidence: d.yoloConf,
      risk: d.yoloConf > 0.82 ? 'high' : d.yoloConf > 0.65 ? 'medium' : 'low',
      action: ACTIONS_MAP[d.yoloConf > 0.82 ? 'high' : d.yoloConf > 0.65 ? 'medium' : 'low'][0],
      hybridConf: d.yoloConf, claudeConf: d.yoloConf, timestamp: new Date().toLocaleTimeString(),
    }));
  }
  const claudeOut = claudeScore(yoloOut);
  const hybrid = hybridFuse(claudeOut);
  // update ml stats
  S.mlStats.yolo = Math.round(yoloOut.reduce((a,d)=>a+d.yoloConf,0)/yoloOut.length*100);
  S.mlStats.claude = Math.round(claudeOut.reduce((a,d)=>a+d.claudeConf,0)/claudeOut.length*100);
  S.mlStats.hybrid = Math.round(hybrid.reduce((a,d)=>a+d.hybridConf,0)/hybrid.length*100);
  return hybrid.filter(d => d.hybridConf >= S.settings.confidenceThreshold);
}

// ═══════════════════════════════════════
// VOICE (TTS)
// ═══════════════════════════════════════
function speak(text, rate, pitch) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate || S.settings.voiceSpeed || 1;
  u.pitch = pitch || S.settings.voicePitch || 1;
  u.lang = 'en-US';
  const voices = window.speechSynthesis.getVoices();
  const pref = voices.find(v => v.name.includes('Google') || v.lang === 'en-US');
  if (pref) u.voice = pref;
  window.speechSynthesis.speak(u);
}

// ═══════════════════════════════════════
// CLAUDE API
// ═══════════════════════════════════════
async function askClaude(prompt, systemPrompt) {
  const body = {
    model: 'claude-sonnet-4-20250514',
    max_tokens: 1000,
    messages: [{role:'user', content: prompt}],
  };
  if (systemPrompt) body.system = systemPrompt;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json();
  return data.content?.[0]?.text || 'Unable to process.';
}

// ═══════════════════════════════════════
// NOTIFICATION
// ═══════════════════════════════════════
function showNotif(msg, type='info') {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.background = type === 'danger' ? '#2d1515' : type === 'success' ? '#152d1a' : '#151a2d';
  el.style.border = `1px solid ${type === 'danger' ? 'var(--red)' : type === 'success' ? 'var(--green)' : 'var(--blue)'}`;
  el.style.color = type === 'danger' ? 'var(--red)' : type === 'success' ? 'var(--green)' : 'var(--blue)';
  clearTimeout(window._notifTimer);
  window._notifTimer = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

function addLog(msg, type='info') {
  S.logs.unshift({id: Date.now(), msg, type, time: new Date().toLocaleTimeString()});
  if (S.logs.length > 100) S.logs.pop();
}

// ═══════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════
const videoEl = document.createElement('video');
videoEl.playsInline = true; videoEl.muted = true; videoEl.autoplay = true;
videoEl.style.cssText = 'width:100%;height:100%;object-fit:cover;';
let streamObj = null;
let scanTimer = null;

async function startCamera() {
  try {
    S.cameraError = '';
    if (streamObj) streamObj.getTracks().forEach(t=>t.stop());
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: S.cameraFacing, width:{ideal:1280}, height:{ideal:720}}, audio: false
    });
    streamObj = stream;
    videoEl.srcObject = stream;
    videoEl.play();
    S.cameraActive = true;
    addLog('Camera started', 'success');
    speak('Camera is now active.');
    render();
  } catch(e) {
    S.cameraError = 'Camera access denied. Please allow permission.';
    addLog('Camera error: ' + e.message, 'danger');
    speak('Camera access denied.');
    render();
  }
}

function stopCamera() {
  if (streamObj) streamObj.getTracks().forEach(t=>t.stop());
  videoEl.srcObject = null;
  S.cameraActive = false;
  S.isScanning = false;
  clearInterval(scanTimer);
  addLog('Camera stopped');
  render();
}

function flipCamera() {
  S.cameraFacing = S.cameraFacing === 'environment' ? 'user' : 'environment';
  if (S.cameraActive) { stopCamera(); setTimeout(() => startCamera(), 300); }
  addLog('Camera flipped');
  render();
}

function toggleScanning() {
  if (S.isScanning) {
    clearInterval(scanTimer);
    S.isScanning = false;
    addLog('Scanning paused');
    speak('Scanning paused.');
  } else {
    S.isScanning = true;
    addLog('AI Hybrid scanning started', 'success');
    speak('Hybrid AI scanning started. I will alert you of any obstacles.');
    const doScan = () => {
      const dets = generateDetection();
      handleDetection(dets);
    };
    doScan();
    scanTimer = setInterval(doScan, S.settings.scanInterval * 1000);
  }
  render();
}

function handleDetection(dets) {
  S.detections = dets;
  if (S.settings.saveHistory) {
    const loc = S.userLocation ? `${S.userLocation.lat.toFixed(4)},${S.userLocation.lng.toFixed(4)}` : S.manualLocation || 'Unknown';
    S.history.unshift({id:Date.now(), detections:dets, timestamp:new Date().toLocaleString(), location:loc});
    if (S.history.length > 200) S.history.pop();
  }
  dets.forEach(d => {
    addLog(`ML: ${d.object} ${d.direction} | YOLO:${Math.round(d.yoloConf*100)}% Claude:${Math.round((d.claudeConf||d.confidence)*100)}% Hybrid:${Math.round(d.hybridConf*100)}%`, d.risk === 'high' ? 'danger' : 'info');
    if (S.settings.autoSpeak) speak(`${d.object} detected ${d.direction}, ${d.distance}. ${d.action}.`);
  });
  const high = dets.filter(d=>d.risk==='high');
  if (high.length > 0 && S.settings.highRiskAlert) {
    showNotif(`⚠️ HIGH RISK: ${high.map(d=>d.object).join(', ')} detected!`, 'danger');
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
  render();
}

// ═══════════════════════════════════════
// SCENE ANALYSIS
// ═══════════════════════════════════════
async function analyzeScene() {
  S.sceneLoading = true; render();
  speak('Analyzing scene, please wait.');
  try {
    const dNames = S.detections.map(d=>`${d.object} ${d.direction} (${d.distance})`).join(', ');
    const loc = S.userLocation ? `at coordinates ${S.userLocation.lat.toFixed(3)}, ${S.userLocation.lng.toFixed(3)}` : S.manualLocation ? `near ${S.manualLocation}` : '';
    const sys = 'You are a compassionate AI navigation assistant for visually impaired people. Be concise, clear, and calm.';
    const result = await askClaude(
      `Objects detected ${loc}: ${dNames || 'none currently'}. Provide a 2-sentence scene description and specific safe navigation advice. Use simple directional language.`,
      sys
    );
    S.sceneText = result;
    speak(result);
    addLog('AI scene analysis complete', 'success');
  } catch {
    const fb = S.detections.length > 0
      ? `I detect ${S.detections.map(d=>d.object).join(' and ')}. ${S.detections[0]?.action || 'Proceed with caution'}.`
      : 'The path appears clear. Proceed carefully.';
    S.sceneText = fb;
    speak(fb);
  }
  S.sceneLoading = false; render();
}

// ═══════════════════════════════════════
// NAVIGATION / LOCATION
// ═══════════════════════════════════════
function getLocation() {
  if (!navigator.geolocation) { speak('GPS not available.'); return; }
  speak('Getting your location.');
  navigator.geolocation.getCurrentPosition(
    pos => {
      S.userLocation = {lat: pos.coords.latitude, lng: pos.coords.longitude};
      addLog(`GPS: ${S.userLocation.lat.toFixed(4)}, ${S.userLocation.lng.toFixed(4)}`, 'success');
      speak(`Location detected. Latitude ${S.userLocation.lat.toFixed(2)}, Longitude ${S.userLocation.lng.toFixed(2)}.`);
      showNotif('📍 Location detected successfully', 'success');
      render();
    },
    () => {
      speak('Unable to get location. Please enter manually.');
      showNotif('GPS unavailable. Enter location manually.', 'danger');
    }
  );
}

async function planRoute(dest) {
  if (!dest?.trim()) { speak('Please enter a destination.'); return; }
  S.navLoading = true; S.navDest = dest; S.navSteps = []; S.activeNavStep = 0; render();
  speak(`Planning route to ${dest}. Please wait.`);
  try {
    const loc = S.userLocation ? `coordinates ${S.userLocation.lat.toFixed(4)}, ${S.userLocation.lng.toFixed(4)}` : S.manualLocation || 'my current location';
    const sys = 'You are a navigation assistant for visually impaired people. Provide extremely clear, step-by-step walking directions. Each step must be one short sentence. Number each step. Focus on landmarks, turns, and distances.';
    const result = await askClaude(
      `Create a safe walking route from ${loc} to ${dest}. Give exactly 5-6 numbered steps. Each step: direction + landmark + distance. Format: "1. Walk straight..." Include potential hazards to watch for.`,
      sys
    );
    S.navSteps = result.split('\n').filter(l => l.trim() && /^\d/.test(l.trim()));
    if (S.navSteps.length === 0) S.navSteps = result.split('\n').filter(Boolean).slice(0, 6);
    speak('Route planned. ' + (S.navSteps[0] || ''));
    addLog(`Route to ${dest} planned (${S.navSteps.length} steps)`, 'success');
  } catch {
    S.navSteps = ['Unable to plan route. Check your connection and try again.'];
  }
  S.navLoading = false; render();
}

function startNavGuide() {
  if (S.navSteps.length === 0) return;
  S.navGuiding = true; S.activeNavStep = 0;
  speak('Starting navigation. ' + S.navSteps[0]);
  render();
}

function nextNavStep() {
  if (S.activeNavStep < S.navSteps.length - 1) {
    S.activeNavStep++;
    speak(S.navSteps[S.activeNavStep]);
  } else {
    speak('You have arrived at your destination. Navigation complete.');
    S.navGuiding = false;
    showNotif('✅ Arrived at destination!', 'success');
  }
  render();
}

function prevNavStep() {
  if (S.activeNavStep > 0) {
    S.activeNavStep--;
    speak(S.navSteps[S.activeNavStep]);
    render();
  }
}

function repeatNavStep() {
  if (S.navSteps[S.activeNavStep]) speak(S.navSteps[S.activeNavStep]);
}

// ═══════════════════════════════════════
// APP ACTIONS (voice-driven)
// ═══════════════════════════════════════
async function handleAppAction(cmd) {
  // open settings
  if (/open settings|settings open|go to settings/.test(cmd)) {
    S.tab = 'settings'; speak('Opening settings.'); render(); return true;
  }
  // open history
  if (/open history|show history|navigation history/.test(cmd)) {
    S.tab = 'history'; speak('Opening navigation history.'); render(); return true;
  }
  // open map / navigation
  if (/open map|open navigation|go to map|show map/.test(cmd)) {
    S.tab = 'map'; speak('Opening navigation map.'); render(); return true;
  }
  // open camera
  if (/open camera|go to camera|camera tab/.test(cmd)) {
    S.tab = 'camera'; speak('Opening camera.'); render(); return true;
  }
  // start camera
  if (/start camera|enable camera|turn on camera/.test(cmd)) {
    S.tab = 'camera'; speak('Starting camera.'); render(); await startCamera(); return true;
  }
  // stop camera
  if (/stop camera|disable camera|turn off camera/.test(cmd)) {
    stopCamera(); return true;
  }
  // start scan / AI scan
  if ((/start scan|begin scan|enable scan|scan now/).test(cmd) && !S.isScanning) {
    toggleScanning(); return true;
  }
  // stop scan
  if (/stop scan|pause scan|disable scan/.test(cmd) && S.isScanning) {
    toggleScanning(); return true;
  }
  // analyze scene
  if (/analyze|analyse|describe scene|what.s around|scene analysis|what do you see/.test(cmd)) {
    S.tab = 'camera'; render(); await analyzeScene(); return true;
  }
  // detect location / my location
  if (/detect location|my location|where am i|find location|get gps/.test(cmd)) {
    getLocation(); return true;
  }
  // navigate to <somewhere>
  const navMatch = cmd.match(/navigate to (.+)|go to (.+)|take me to (.+)|directions to (.+)|route to (.+)/);
  if (navMatch) {
    const dest = (navMatch[1]||navMatch[2]||navMatch[3]||navMatch[4]||navMatch[5]).trim();
    S.tab = 'map'; render();
    document.getElementById('dest-input') && (document.getElementById('dest-input').value = dest);
    await planRoute(dest);
    return true;
  }
  // flip camera
  if (/flip camera|switch camera|rotate camera/.test(cmd)) {
    flipCamera(); return true;
  }
  // repeat last
  if (/repeat|say again|what did you say/.test(cmd)) {
    if (S.detections.length > 0) speak(`${S.detections[0].object} ${S.detections[0].direction}, ${S.detections[0].distance}. ${S.detections[0].action}.`);
    else speak('No obstacles currently detected.');
    return true;
  }
  // call caregiver
  if (/call caregiver|call help|emergency call/.test(cmd)) {
    if (S.profile?.caregiverPhone) {
      speak(`Calling ${S.profile.caregiverName || 'your caregiver'}.`);
      showNotif(`📞 Calling ${S.profile.caregiverName || 'Caregiver'}...`, 'info');
      window.open(`tel:${S.profile.caregiverPhone}`);
    } else {
      speak('No caregiver phone number saved. Please add one in settings.');
    }
    return true;
  }
  // read detections
  if (/what is detected|what obstacles|list obstacles|read detections/.test(cmd)) {
    if (S.detections.length > 0) {
      speak(S.detections.map(d=>`${d.object} ${d.direction}, ${d.distance}.`).join(' '));
    } else speak('No obstacles detected right now.');
    return true;
  }
  // next step / prev step (navigation)
  if (/next step|continue|next direction/.test(cmd)) {
    nextNavStep(); return true;
  }
  if (/previous step|go back|last step/.test(cmd)) {
    prevNavStep(); return true;
  }
  // voice speed
  if (/speak faster|talk faster/.test(cmd)) {
    S.settings.voiceSpeed = Math.min(2, S.settings.voiceSpeed + 0.2);
    speak('Speaking faster now.'); render(); return true;
  }
  if (/speak slower|talk slower/.test(cmd)) {
    S.settings.voiceSpeed = Math.max(0.5, S.settings.voiceSpeed - 0.2);
    speak('Speaking slower now.'); render(); return true;
  }
  // toggle auto-speak
  if (/enable auto speak|turn on auto speak/.test(cmd)) {
    S.settings.autoSpeak = true; speak('Auto announcements enabled.'); render(); return true;
  }
  if (/disable auto speak|turn off auto speak/.test(cmd)) {
    S.settings.autoSpeak = false; speak('Auto announcements disabled.'); render(); return true;
  }
  // export history
  if (/export history|save history|download history/.test(cmd)) {
    exportHistory(); return true;
  }
  // clear history
  if (/clear history|delete history/.test(cmd)) {
    S.history = []; speak('Navigation history cleared.'); render(); return true;
  }
  // help
  if (/help|what can you do|commands/.test(cmd)) {
    speak('I can: open camera, start scan, analyze scene, navigate to a place, detect location, call caregiver, open settings, repeat last detection, next step, and more.');
    return true;
  }
  return false;
}

// ═══════════════════════════════════════
// VOICE RECOGNITION
// ═══════════════════════════════════════
let recObj = null;
function startVoiceCmd() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    speak('Voice commands are not supported in your browser.'); return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 3;
  rec.onstart = () => { S.isListening = true; S.voiceStatus = 'Listening...'; render(); };
  rec.onresult = async (e) => {
    const cmd = e.results[0][0].transcript.toLowerCase().trim();
    S.voiceStatus = `Heard: "${cmd}"`;
    addLog(`🎤 "${cmd}"`);
    render();
    const handled = await handleAppAction(cmd);
    if (!handled) {
      speak(`Command not recognized. Say "help" for available commands.`);
      showNotif(`❓ Unknown: "${cmd}"`, 'info');
    }
  };
  rec.onerror = () => { S.isListening = false; S.voiceStatus = ''; render(); };
  rec.onend = () => { S.isListening = false; setTimeout(() => { S.voiceStatus = ''; render(); }, 3000); };
  rec.start();
  recObj = rec;
}

// ═══════════════════════════════════════
// HISTORY EXPORT
// ═══════════════════════════════════════
function exportHistory() {
  const data = JSON.stringify(S.history, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `nav-history-${S.profile?.name||'user'}-${Date.now()}.json`;
  a.click();
  speak('History exported.');
}

// ── MAP TAB ──

  const mapUrl = S.userLocation
    ? `https://www.openstreetmap.org/export/embed.html?bbox=${S.userLocation.lng-0.01},${S.userLocation.lat-0.01},${S.userLocation.lng+0.01},${S.userLocation.lat+0.01}&layer=mapnik&marker=${S.userLocation.lat},${S.userLocation.lng}`

  return `<div class="map-grid">
    <div>
      <!-- Map -->
      <div class="card" style="margin-bottom:14px;">
        <div class="card-hd">
          <span class="card-title">${icon('map',14,'var(--teal)')} Live Map</span>

        <div class="map-frame">
          ${mapUrl ? `<iframe src="${mapUrl}" title="map" style="width:100%;height:100%;border:none;filter:invert(0.9) hue-rotate(180deg) saturate(0.8);"></iframe>`

      </div>

      <!-- Route Planner -->

          <label class="input-label">Where do you want to go?</label>
          <div style="position:relative;">
            <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);">${icon('location',16,'var(--t3)')}</span>
            <input id="dest-input" class="input-field" style="padding-left:38px;" placeholder="e.g. nearest hospital, park, bus stop..." value="${S.navDest}"
              oninput="S.navDest=this.value" onkeydown="if(event.key==='Enter')planRoute(S.navDest)"/>

        </div>
        <button class="btn-primary" onclick="planRoute(document.getElementById('dest-input').value)" ${S.navLoading?'disabled':''}>
          ${S.navLoading ? `<div style="width:15px;height:15px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></div> Planning with Claude AI...`
          : `${icon('navigation',16,'#fff')} Plan Route with AI →`}
        </button>

        ${S.navSteps.length > 0 ? `
          <div style="margin-top:14px;padding:16px;background:var(--bg2);border-radius:var(--rs);border:1px solid var(--border2);animation:fadeIn 0.4s;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
              <p style="font-size:12px;color:var(--blue);font-weight:700;letter-spacing:0.5px;">NAVIGATION GUIDE → ${S.navDest}</p>
              <div style="display:flex;gap:6px;">
                ${!S.navGuiding ? `<button class="btn-outline" style="font-size:11px;padding:5px 10px;" onclick="startNavGuide()">${icon('volume',12,'var(--blue)')} Start Guide</button>` : ''}
                <button class="btn-outline" style="font-size:11px;padding:5px 10px;" onclick="speak(S.navSteps.join(' '))">${icon('volume',12,'var(--blue)')} Read All</button>
              </div>
            </div>
            ${S.navSteps.map((step, i)=>`
              <div class="nav-step" style="animation-delay:${i*0.08}s;${S.navGuiding && i===S.activeNavStep?'background:rgba(99,179,237,0.1);border-radius:8px;padding:8px;border:1px solid var(--border2);':i<S.activeNavStep&&S.navGuiding?'opacity:0.4;':''}" onclick="speak(step)">
                <div class="step-num" style="background:${S.navGuiding&&i===S.activeNavStep?'var(--teal)':i<S.activeNavStep&&S.navGuiding?'var(--t3)':'var(--blue)'};">${i+1}</div>

            ${S.navGuiding ? `
              <div style="display:flex;gap:8px;margin-top:12px;">
                <button class="btn-outline" style="flex:1;justify-content:center;font-size:13px;" onclick="prevNavStep()" ${S.activeNavStep===0?'disabled style="opacity:0.4;"':''}>
                  ${icon('chevronL',14,'var(--blue)')} Prev
                </button>
                <button onclick="repeatNavStep()" style="flex:1;padding:10px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--gteal);color:var(--teal);cursor:pointer;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;">
                  ${icon('volume',14,'var(--teal)')} Repeat
                </button>
                <button class="btn-outline" style="flex:1;justify-content:center;font-size:13px;border-color:var(--teal);color:var(--teal);background:var(--gteal);" onclick="nextNavStep()">
                  Next ${icon('chevron',14,'var(--teal)')}
                </button>
              </div>
              <p style="text-align:center;font-size:11px;color:var(--t3);margin-top:8px;font-family:'IBM Plex Mono',monospace;">Step ${S.activeNavStep+1} of ${S.navSteps.length}</p>` : ''}
          </div>` : ''}
      </div>
    </div>

    <!-- Right Panel -->
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="card" style="padding:18px;">
        <h3 style="font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;">${icon('location',14,'var(--orange)')} Location</h3>
        <button class="btn-primary" onclick="getLocation()" style="margin-bottom:12px;">
          ${icon('location',16,'#fff')} Detect My Location (GPS)
        </button>
        <p style="font-size:12px;color:var(--t3);margin-bottom:10px;text-align:center;">— or enter manually —</p>
        <div class="input-wrap" style="margin-bottom:0;">
          <label class="input-label">City / Address</label>
          <div style="position:relative;">
            <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);">${icon('map',14,'var(--t3)')}</span>
            <input class="input-field" style="padding-left:36px;font-size:13px;" placeholder="e.g. Lahore, Pakistan" value="${S.manualLocation}" oninput="S.manualLocation=this.value"/>
          </div>
        </div>
        ${S.userLocation ? `<div style="padding:12px;border-radius:var(--rs);background:rgba(104,211,145,0.08);border:1px solid rgba(104,211,145,0.25);margin-top:10px;">
          <p style="font-size:12px;color:var(--green);font-weight:700;">✓ GPS Active</p>
          <p style="font-size:11px;color:var(--t2);font-family:'IBM Plex Mono',monospace;margin-top:4px;">${S.userLocation.lat.toFixed(6)}</p>
          <p style="font-size:11px;color:var(--t2);font-family:'IBM Plex Mono',monospace;">${S.userLocation.lng.toFixed(6)}</p>
        </div>` : ''}
      </div>

      <!-- Quick Destinations -->
      <div class="card" style="padding:16px;">
        <p style="font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1px;margin-bottom:12px;">QUICK NAVIGATE</p>
        ${['Nearest Hospital','Nearest Mosque','Bus Stop','Police Station','Pharmacy','Market'].map(dest=>`
          <button onclick="S.tab='map';render();planRoute('${dest}')" style="width:100%;text-align:left;padding:9px 12px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;font-family:'Syne',sans-serif;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:8px;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--blue)';this.style.color='var(--blue)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--t2)'">
            ${icon('navigation',14,'currentColor')} ${dest}
          </button>`).join('')}
      </div>

      <!-- Recent -->
      <div class="card" style="padding:16px;">
        <p style="font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1px;margin-bottom:12px;">RECENT SESSIONS</p>
        ${S.history.slice(0,5).map((h,i)=>`
          <div style="padding:8px 0;border-bottom:${i<4?'1px solid var(--border)':'none'};">
            <p style="font-size:12px;font-weight:600;">${h.detections.map(d=>d.object).slice(0,2).join(', ')}</p>
            <p style="font-size:10px;color:var(--t3);margin-top:2px;font-family:'IBM Plex Mono',monospace;">📍 ${h.location} · ${h.timestamp}</p>
          </div>`).join('') || `<p style="color:var(--t3);font-size:12px;">No sessions yet</p>`}
      </div>
    </div>
  </div>`;
}

// ── HISTORY TAB ──
function renderHistory() {
  const [filter, setFilter] = [window._histFilter || 'all', v => { window._histFilter = v; render(); }];
  const filtered = filter === 'all' ? S.history : S.history.filter(h=>h.detections.some(d=>d.risk===filter));
  const total = S.history.reduce((a,h)=>a+h.detections.length, 0);
  const high = S.history.reduce((a,h)=>a+h.detections.filter(d=>d.risk==='high').length, 0);
  return `<div>
    <div class="stat-grid">
      ${[
        {label:'Sessions', val:S.history.length, c:'var(--blue)'},
        {label:'Obstacles', val:total, c:'var(--teal)'},
        {label:'High Risk', val:high, c:'var(--red)'},
        {label:'Safe', val:total-high, c:'var(--green)'},
      ].map(s=>`<div class="stat-card">
        <p style="font-size:22px;font-weight:800;color:${s.c};">${s.val}</p>
        <p style="font-size:11px;color:var(--t2);margin-top:2px;">${s.label}</p>
      </div>`).join('')}
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${['all','high','medium','low'].map(f=>`
          <button onclick="window._histFilter='${f}';render()" style="padding:6px 14px;border-radius:99px;border:${filter===f?'none':'1px solid var(--border)'};background:${filter===f?'var(--blue)':'transparent'};color:${filter===f?'#fff':'var(--t2)'};cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;font-weight:600;text-transform:capitalize;">${f==='all'?'All':f+' Risk'}</button>`).join('')}
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-outline" onclick="exportHistory()">${icon('save',14,'var(--blue)')} Export</button>
        <button onclick="S.history=[];speak('History cleared.');render()" style="padding:7px 14px;border-radius:var(--rs);border:1px solid rgba(252,129,129,0.3);background:rgba(252,129,129,0.08);color:var(--red);cursor:pointer;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;">${icon('trash',14,'var(--red)')} Clear</button>
      </div>
    </div>
    ${filtered.length === 0 ? `<div class="card" style="padding:48px;text-align:center;">
      <div style="font-size:44px;margin-bottom:10px;">📋</div>
      <p style="color:var(--t2);font-size:14px;">No navigation history</p>
      <p style="color:var(--t3);font-size:12px;margin-top:6px;">Start scanning to record sessions</p>
    </div>` : `<div style="display:flex;flex-direction:column;gap:8px;">
      ${filtered.map((h,i)=>`<div class="hist-item" style="animation-delay:${i*0.03}s;">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
          <div style="display:flex;gap:5px;flex-wrap:wrap;">
            ${h.detections.map(d=>`<span style="padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:${d.risk==='high'?'rgba(252,129,129,0.12)':d.risk==='medium'?'rgba(246,173,85,0.12)':'rgba(104,211,145,0.12)'};color:${d.risk==='high'?'var(--red)':d.risk==='medium'?'var(--orange)':'var(--green)'};">${d.object}</span>`).join('')}
          </div>
          <div style="text-align:right;">
            <p style="font-size:11px;color:var(--t3);font-family:'IBM Plex Mono',monospace;">${h.timestamp}</p>
            <p style="font-size:10px;color:var(--t3);">📍 ${h.location}</p>
          </div>
        </div>
        ${h.detections.map(d=>`<p style="font-size:12px;color:var(--t2);margin-bottom:2px;">• ${d.object} ${d.direction} (${d.distance}) — ${d.action}</p>`).join('')}
        <button onclick="speak('${h.detections.map(d=>`${d.object} detected ${d.direction}, ${d.distance}. ${d.action}.`).join(' ').replace(/'/g,"\\'")}' )" class="btn-outline" style="margin-top:8px;font-size:11px;padding:5px 10px;">${icon('volume',12,'var(--blue)')} Replay</button>
      </div>`).join('')}
    </div>`}
  </div>`;
}

// ── SETTINGS TAB ──
function renderSettings() {
  const tog = (key) => { S.settings[key] = !S.settings[key]; speak(`${key.replace(/([A-Z])/g,' $1')} ${S.settings[key]?'enabled':'disabled'}`); render(); };
  return `<div style="max-width:700px;">
    <!-- Profile -->
    <div class="setting-section">
      <div class="setting-title">${icon('user',15,'var(--blue)')} Profile</div>
      <div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);">
        <div style="width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));display:flex;align-items:center;justify-content:center;font-size:26px;">${S.profile.avatar}</div>
        <div>
          <p style="font-size:15px;font-weight:700;">${S.profile.name}</p>
          ${S.profile.age ? `<p style="font-size:12px;color:var(--t2);">Age: ${S.profile.age}</p>` : ''}
          ${S.profile.caregiverName ? `<p style="font-size:12px;color:var(--teal);">Caregiver: ${S.profile.caregiverName} ${S.profile.caregiverPhone?`(${S.profile.caregiverPhone})`:''}</p>` : ''}
        </div>
      </div>
      <div style="padding-top:12px;display:flex;gap:8px;">
        <button onclick="S.profile=null;S.profileStep=1;render()" style="padding:9px 18px;border-radius:var(--rs);border:1px solid rgba(252,129,129,0.3);background:rgba(252,129,129,0.08);color:var(--red);cursor:pointer;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;">Reset Profile</button>
        ${S.profile.caregiverPhone ? `<button onclick="window.open('tel:${S.profile.caregiverPhone}')" class="btn-outline">${icon('phone',14,'var(--blue)')} Call Caregiver</button>` : ''}
      </div>
    </div>

    <!-- Voice -->
    <div class="setting-section">
      <div class="setting-title">${icon('volume',15,'var(--blue)')} Voice & Audio</div>
      <div style="margin-bottom:16px;">
        <label class="input-label">Voice Speed: ${S.settings.voiceSpeed.toFixed(1)}x</label>
        <input type="range" min="0.5" max="2" step="0.1" value="${S.settings.voiceSpeed}" oninput="S.settings.voiceSpeed=parseFloat(this.value);speak('Sample speed',parseFloat(this.value));document.getElementById('vspeed').textContent=parseFloat(this.value).toFixed(1)+'x';" style="width:100%;margin-top:6px;accent-color:var(--blue);" id="vspeedRange"/>
      </div>
      <div style="margin-bottom:16px;">
        <label class="input-label">Voice Pitch: ${S.settings.voicePitch.toFixed(1)}</label>
        <input type="range" min="0.5" max="2" step="0.1" value="${S.settings.voicePitch}" oninput="S.settings.voicePitch=parseFloat(this.value);" style="width:100%;margin-top:6px;accent-color:var(--teal);"/>
      </div>
      ${renderToggle('Auto-speak detections', 'Automatically announce detected obstacles', S.settings.autoSpeak, ()=>tog('autoSpeak'))}
      ${renderToggle('High-risk alerts', 'Extra alerts for dangerous obstacles + vibration', S.settings.highRiskAlert, ()=>tog('highRiskAlert'))}
      <button onclick="speak('Smart Blind Assistant voice test. Hybrid ML engine active. Everything working correctly.',S.settings.voiceSpeed,S.settings.voicePitch)" class="btn-outline" style="margin-top:10px;">${icon('volume',14,'var(--blue)')} Test Voice</button>
    </div>

    <!-- ML Hybrid Engine -->
    <div class="setting-section">
      <div class="setting-title">${icon('eye',15,'var(--blue)')} ML Hybrid Engine</div>
      ${renderToggle('Hybrid ML Engine', 'Combines YOLO + Claude AI for best accuracy', S.settings.hybridML, ()=>tog('hybridML'))}
      <div style="margin:16px 0;">
        <label class="input-label">Confidence Threshold: ${(S.settings.confidenceThreshold*100).toFixed(0)}%</label>
        <input type="range" min="0.4" max="0.95" step="0.05" value="${S.settings.confidenceThreshold}" oninput="S.settings.confidenceThreshold=parseFloat(this.value);render();" style="width:100%;margin-top:6px;accent-color:var(--green);"/>
        <p style="font-size:11px;color:var(--t3);margin-top:4px;">Objects below this confidence are filtered out</p>
      </div>
      <div style="margin-bottom:14px;">
        <label class="input-label">Scan Interval: every ${S.settings.scanInterval}s</label>
        <input type="range" min="1" max="10" step="1" value="${S.settings.scanInterval}" oninput="S.settings.scanInterval=parseInt(this.value);render();" style="width:100%;margin-top:6px;accent-color:var(--teal);"/>
      </div>
      ${renderToggle('Save Navigation History', 'Store all sessions for review', S.settings.saveHistory, ()=>tog('saveHistory'))}
      <div style="padding:12px;background:rgba(99,179,237,0.06);border-radius:var(--rs);border:1px solid var(--border2);margin-top:10px;">
        <p style="font-size:11px;color:var(--t2);line-height:1.6;">🧠 <strong style="color:var(--blue);">YOLO Engine</strong> — Fast real-time object detection with bounding boxes<br>
        🤖 <strong style="color:var(--blue);">Claude AI</strong> — Semantic scene understanding & context analysis<br>
        ⚡ <strong style="color:var(--green);">Hybrid Fusion</strong> — Weighted average (YOLO×45% + Claude×55%) for maximum accuracy</p>
      </div>
    </div>

    <!-- About -->
    <div class="setting-section">
      <div class="setting-title">${icon('alert',15,'var(--blue)')} About</div>
      <div style="padding:8px 0;">
        ${[
          ['App Version','3.0.0 (Hybrid ML)'],
          ['AI Engine','Claude Sonnet 4 (Anthropic)'],
          ['Object Detection','YOLO v8 Hybrid (simulated)'],
          ['Speech','Web Speech API'],
          ['GPS','Browser Geolocation'],
          ['Voice Commands','30+ supported commands'],
          ['Navigation','AI turn-by-turn guidance'],
        ].map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <span style="color:var(--t2);">${k}</span>
          <span style="color:var(--t1);font-family:'IBM Plex Mono',monospace;font-size:12px;">${v}</span>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function renderToggle(label, desc, checked, onclick) {
  const id = 'tog_' + Math.random().toString(36).slice(2);
  setTimeout(() => {
    const btn = document.getElementById(id);
    if (btn) btn.onclick = onclick;
  }, 0);
  return `<div class="toggle-row">
    <div>
      <p style="font-size:13px;font-weight:600;">${label}</p>
      <p style="font-size:11px;color:var(--t3);margin-top:2px;">${desc}</p>
    </div>
    <button id="${id}" class="toggle" style="background:${checked?'var(--blue)':'var(--bg3)'};">
      <div class="toggle-knob" style="left:${checked?'23':'3'}px;"></div>
    </button>
  </div>`;
}

// ── NAV BAR ──
function renderNavBar() {
  const TABS = [
    {id:'camera', label:'Camera', icon:'camera'},
    {id:'map', label:'Navigate', icon:'map'},
    {id:'history', label:'History', icon:'history'},
    {id:'settings', label:'Settings', icon:'settings'},
  ];
  return `<nav>
    ${TABS.map(t=>`
      <button class="tab-btn" onclick="S.tab='${t.id}';speak('${t.label}');render();">
        <div class="tab-icon ${S.tab===t.id?'active':''}">${icon(t.icon, 20, S.tab===t.id?'var(--blue)':'var(--t3)')}</div>
        <span class="tab-label ${S.tab===t.id?'active':''}">${t.label}</span>
      </button>`).join('')}
  </nav>`;
}

function attachMainEvents() {
  // re-attach video after render if camera active
  if (S.cameraActive) {
    const vc = document.getElementById('video-container');
    if (vc && !vc.contains(videoEl)) vc.appendChild(videoEl);
  }
}

// ═══════════════════════════════════════
// BOOT
// ═══════════════════════════════════════
window.addEventListener('load', () => {
  window.speechSynthesis?.getVoices();
  render();
  setTimeout(() => speak('Smart Blind Assistant ready. Please complete your profile setup.'), 500);
});

// expose globals for inline handlers
window.S = S;
window.startCamera = startCamera;
window.stopCamera = stopCamera;
window.flipCamera = flipCamera;
window.toggleScanning = toggleScanning;
window.analyzeScene = analyzeScene;
window.startVoiceCmd = startVoiceCmd;
window.getLocation = getLocation;
window.planRoute = planRoute;
window.startNavGuide = startNavGuide;
window.nextNavStep = nextNavStep;
window.prevNavStep = prevNavStep;
window.repeatNavStep = repeatNavStep;
window.exportHistory = exportHistory;
window.speak = speak;
window.render = render;
</script>
</body>
</html>
